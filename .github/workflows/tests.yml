name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Tests (sans accès réseau)
        run: python -m pytest -q
      - name: Pipeline d'analyse sur l'instantané versionné
        run: |
          python -m src.report > /dev/null
          python -m src.model
